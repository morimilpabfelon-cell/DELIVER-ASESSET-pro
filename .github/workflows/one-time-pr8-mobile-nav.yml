name: One-time PR8 mobile navigation migration

on:
  push:
    branches: [feat/mobile-navigation-accessibility]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/mobile-navigation-accessibility

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Correct TypeScript focus narrowing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-mobile-navigation-pr8.mjs')
          source = path.read_text()
          source = source.replace(
              "      (element): element is HTMLElement => element instanceof HTMLElement,",
              "      (element): element is HTMLButtonElement | HTMLAnchorElement => element !== null,",
          )
          source = source.replace(
              "      const firstElement = focusableElements[0];\n      const lastElement = focusableElements[focusableElements.length - 1];",
              "      const firstElement = focusableElements.at(0);\n      const lastElement = focusableElements.at(-1);\n      if (!firstElement || !lastElement) return;",
          )
          path.write_text(source)
          PY

      - name: Apply accessible navigation migration
        run: node scripts/apply-mobile-navigation-pr8.mjs

      - name: Verify final tree and build
        run: |
          test ! -f scripts/apply-mobile-navigation-pr8.mjs
          test ! -f .github/workflows/one-time-pr8-mobile-nav.yml
          test ! -f .github/pr8-trigger.txt
          npm run build

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(accessibility): add mobile navigation and focus management"
          git push origin HEAD:feat/mobile-navigation-accessibility

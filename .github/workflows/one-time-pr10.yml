name: One-time PR10 hero cleanup

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'fix/remove-hero-ring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/remove-hero-ring
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: node scripts/apply-pr10.mjs
      - run: npm run build
      - name: Commit final change
        run: |
          test ! -f scripts/apply-pr10.mjs
          test ! -f .github/workflows/one-time-pr10.yml
          test ! -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): remove hero ring and guard against regression"
          git push origin HEAD:fix/remove-hero-ring

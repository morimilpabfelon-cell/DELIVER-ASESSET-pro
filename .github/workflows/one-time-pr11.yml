name: One-time PR11 engineering baseline

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: one-time-pr11-engineering-baseline
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'chore/engineering-quality-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: chore/engineering-quality-baseline
      - name: Capture migration files
        run: |
          mkdir -p /tmp/pr11-migration/.github/workflows /tmp/pr11-migration/scripts
          cp .github/workflows/one-time-pr11.yml /tmp/pr11-migration/.github/workflows/
          cp scripts/apply-pr11.mjs scripts/fix-pr11-generator.mjs /tmp/pr11-migration/scripts/
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Repair generator template
        run: node scripts/fix-pr11-generator.mjs
      - name: Apply engineering baseline
        run: node scripts/apply-pr11.mjs
      - name: Install and lock quality tooling
        run: |
          npm install --save-dev --save-exact \
            typescript@6 \
            @eslint/js@9 eslint@9 typescript-eslint globals \
            eslint-plugin-react-hooks eslint-plugin-jsx-a11y \
            vitest @vitest/coverage-v8 \
            @stryker-mutator/core @stryker-mutator/vitest-runner
          npm pkg set packageManager="npm@10.9.8"
      - name: Run full quality baseline
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run quality
          npm run test:mutation
          npm run security:audit
      - name: Verify final product tree
        run: |
          test ! -e scripts/apply-pr11.mjs
          test ! -e scripts/fix-pr11-generator.mjs
          test ! -e .github/workflows/one-time-pr11.yml
          test -f package-lock.json
          ! git grep -n "npm install" -- .github/workflows/ci.yml .github/workflows/pages.yml
      - name: Restore migration files for connector cleanup
        run: |
          mkdir -p .github/workflows scripts
          cp /tmp/pr11-migration/.github/workflows/one-time-pr11.yml .github/workflows/
          cp /tmp/pr11-migration/scripts/apply-pr11.mjs /tmp/pr11-migration/scripts/fix-pr11-generator.mjs scripts/
      - name: Commit non-workflow baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No hay cambios por publicar"; exit 1; }
          git commit -m "Chore: baseline de calidad y despliegue verificable"
          git push origin HEAD:chore/engineering-quality-baseline

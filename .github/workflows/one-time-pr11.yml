name: One-time PR11 engineering baseline

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: one-time-pr11-engineering-baseline
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrate:
    if: github.head_ref == 'chore/engineering-quality-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: chore/engineering-quality-baseline
      - name: Capture starting revision
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Repair generator template
        run: node scripts/fix-pr11-generator.mjs
      - name: Apply engineering baseline
        run: node scripts/apply-pr11.mjs
      - name: Install and lock quality tooling
        run: |
          npm install --save-dev --save-exact \
            typescript@6 \
            @eslint/js@9 eslint@9 typescript-eslint globals \
            eslint-plugin-react-hooks eslint-plugin-jsx-a11y \
            vitest @vitest/coverage-v8 \
            @stryker-mutator/core @stryker-mutator/vitest-runner
          npm pkg set packageManager="npm@10.9.8"
      - name: Run full quality baseline
        env:
          BUILD_SHA: ${{ steps.start.outputs.sha }}
        run: |
          npm run quality
          npm run test:mutation
          npm run security:audit
      - name: Verify final product tree
        run: |
          test ! -e scripts/apply-pr11.mjs
          test ! -e scripts/fix-pr11-generator.mjs
          test ! -e .github/workflows/one-time-pr11.yml
          test -f package-lock.json
          ! git grep -n "npm install" -- .github/workflows/ci.yml .github/workflows/pages.yml
      - name: Package validated final tree
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=coverage \
            --exclude=reports \
            --exclude=.stryker-tmp \
            -czf /tmp/pr11-final-tree.tar.gz .
          sha256sum /tmp/pr11-final-tree.tar.gz | tee /tmp/pr11-final-tree.sha256
      - name: Upload validated final tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr11-final-tree
          path: |
            /tmp/pr11-final-tree.tar.gz
            /tmp/pr11-final-tree.sha256
          retention-days: 7
          if-no-files-found: error
